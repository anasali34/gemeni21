<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سیستەمی دکتۆر ئایتی</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #e9ecef; font-family: Tahoma; } .card { border-radius: 15px; padding: 20px; margin-bottom: 20px; }</style>
</head>
<body class="p-4">

<div id="login-section" class="container" style="max-width:400px;">
    <div class="card text-center">
        <h3>چوونەژوورەوە</h3>
        <input type="text" id="user" class="form-control mb-2" placeholder="بەکارهێنەر">
        <input type="password" id="pass" class="form-control mb-2" placeholder="پاسۆرد">
        <button class="btn btn-primary w-100" onclick="login()">چوونەژوورەوە</button>
    </div>
</div>

<div id="main-app" class="d-none container">
    <div class="alert alert-info text-center">بەخێربێن بۆ سیستەمی دکتۆر ئایتی | <b>نرخی دۆلار: <span id="rateDisplay">0</span></b></div>
    <div class="mb-4 text-center">
        <button class="btn btn-secondary" onclick="show('about-sec')">دەربارەی من</button>
        <button class="btn btn-primary" onclick="show('sales-sec')">فرۆشتن</button>
        <button id="calc-tab" class="btn btn-success d-none" onclick="show('calc-sec')">حیسابکەر</button>
        <button id="admin-tab" class="btn btn-warning d-none" onclick="show('admin-sec')">بەڕێوەبردن</button>
        <button id="debt-tab" class="btn btn-danger d-none" onclick="show('debt-sec')">قەرزداران</button>
        <button id="report-tab" class="btn btn-info d-none" onclick="show('report-sec')">ڕاپۆرت</button>
    </div>
    
    <div id="about-sec" class="card text-center">
        <h2 class="text-primary">DR.IT MUSTAFA</h2>
        <h4 class="text-secondary">07701990604</h4>
        <p>ناونیشان: سلێمانی - ڕاپەڕین - خوار کۆمپانیای بێستون</p>
        <hr>
        <div class="alert alert-success">هەرزانترین نرخ، باشترین کوالێتی، متمانە لای ئێمەیە!</div>
    </div>

    <div id="calc-sec" class="card d-none text-center">
        <h4>حیسابکردنی دراو</h4>
        <input type="number" id="calcInput" class="form-control mb-2" placeholder="ژمارەکە بنووسە">
        <button class="btn btn-primary" onclick="convert('USD')">بە دۆلار (USD)</button>
        <button class="btn btn-danger" onclick="convert('IQD')">بە دینار (IQD)</button>
        <h4 class="mt-3 text-success" id="calcResult">ئەنجام: 0</h4>
    </div>

    <div id="sales-sec" class="card d-none">
        <h5>فرۆشتنی نوێ</h5>
        <select id="itemList" class="form-control mb-2"></select>
        <input type="number" id="sellQty" class="form-control mb-2" placeholder="چەند دانە؟">
        <input type="text" id="cName" class="form-control mb-2" placeholder="ناوی کڕیار">
        <select id="currencyType" class="form-control mb-2"><option value="USD">دۆلار</option><option value="IQD">دینار</option></select>
        <button class="btn btn-success w-100" onclick="sell()">تۆمارکردن</button>
    </div>

    <div id="debt-sec" class="d-none mt-4 card">
        <h4>قەرزداران</h4>
        <table class="table"><tbody id="debtTable"></tbody></table>
    </div>

    <div id="report-sec" class="d-none mt-4 card">
        <h4>ڕاپۆرت و خەرجی</h4>
        <div class="input-group mb-3">
            <input type="text" id="expenseName" class="form-control" placeholder="ناوی خەرجی">
            <input type="number" id="expenseAmount" class="form-control" placeholder="بڕەکەی">
            <button class="btn btn-danger" onclick="addExpense()">تۆمارکردن</button>
        </div>
        <table class="table"><tbody id="historyTable"></tbody></table>
    </div>

    <div id="admin-sec" class="d-none mt-4 card">
        <h4>بەڕێوەبردن</h4>
        <input type="number" id="newRate" class="form-control" placeholder="نرخی دۆلار">
        <button class="btn btn-primary w-100 mt-1" onclick="updateRate()">نوێکردنەوە</button>
        <hr>
        <input type="text" id="pName" class="form-control" placeholder="ناوی کاڵا">
        <input type="number" id="pPrice" class="form-control" placeholder="نرخ">
        <input type="number" id="pQty" class="form-control" placeholder="ژمارە">
        <button class="btn btn-success w-100 mt-2" onclick="addProduct()">زیادکردن</button>
        <hr>
        <table class="table mt-3"><tbody id="adminProdTable"></tbody></table>
    </div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let debts = JSON.parse(localStorage.getItem('debts')) || [];
    let history = JSON.parse(localStorage.getItem('history')) || [];
    let rate = localStorage.getItem('dollarRate') || "1500";
    let currentUser = "";

    function login() {
        let u = document.getElementById('user').value;
        if((u === "mustafa" || u === "staff") && document.getElementById('pass').value === "123") {
            currentUser = u;
            document.getElementById('login-section').classList.add('d-none');
            document.getElementById('main-app').classList.remove('d-none');
            document.getElementById('rateDisplay').innerText = rate;
            document.getElementById('calc-tab').classList.remove('d-none');
            if(u === "mustafa") {
                document.getElementById('admin-tab').classList.remove('d-none');
                document.getElementById('debt-tab').classList.remove('d-none');
                document.getElementById('report-tab').classList.remove('d-none');
            }
            render();
        } else alert("زانیاری هەڵەیە!");
    }

    function show(id) { 
        ['about-sec', 'calc-sec', 'sales-sec', 'admin-sec', 'debt-sec', 'report-sec'].forEach(s => document.getElementById(s).classList.add('d-none')); 
        document.getElementById(id).classList.remove('d-none'); 
    }

    function convert(type) {
        let val = document.getElementById('calcInput').value;
        let res = (type === 'IQD') ? (val * rate) : (val / rate);
        document.getElementById('calcResult').innerText = "ئەنجام: " + res.toLocaleString();
    }

    function addExpense() {
        let name = document.getElementById('expenseName').value;
        let amount = document.getElementById('expenseAmount').value;
        history.push({item: "خەرجی: " + name, total: -parseInt(amount), time: new Date()});
        localStorage.setItem('history', JSON.stringify(history));
        render();
    }

    function render() {
        document.getElementById('itemList').innerHTML = products.map(p => `<option>${p.name}</option>`).join('');
        document.getElementById('debtTable').innerHTML = debts.map((d, i) => `<tr><td>${d.cName}</td><td>${d.total}$</td></tr>`).join('');
        document.getElementById('adminProdTable').innerHTML = products.map((p, i) => `<tr><td>${p.name}</td><td><button class="btn btn-danger btn-sm" onclick="deleteProduct(${i})">سڕینەوە</button></td></tr>`).join('');
        document.getElementById('historyTable').innerHTML = history.map((h, i) => `<tr><td>${h.item}</td><td>${h.total}</td><td>${(currentUser === "mustafa" ? `<button class="btn btn-danger btn-sm" onclick="deleteHistory(${i})">سڕینەوە</button>` : '')}</td></tr>`).join('');
    }

    function deleteProduct(i) { products.splice(i, 1); localStorage.setItem('products', JSON.stringify(products)); render(); }
    function deleteHistory(i) { history.splice(i, 1); localStorage.setItem('history', JSON.stringify(history)); render(); }
    function updateRate() { rate = document.getElementById('newRate').value; localStorage.setItem('dollarRate', rate); document.getElementById('rateDisplay').innerText = rate; alert("نرخ نوێکرایەوە"); }
    function addProduct() { products.push({name: document.getElementById('pName').value, price: document.getElementById('pPrice').value, qty: document.getElementById('pQty').value}); localStorage.setItem('products', JSON.stringify(products)); render(); }
    function sell() { let p = products.find(i => i.name === document.getElementById('itemList').value); let q = parseInt(document.getElementById('sellQty').value); let cur = document.getElementById('currencyType').value; if(!p || q > p.qty) return alert("کێشە!"); p.qty -= q; history.push({item: p.name + " (" + cur + ")", total: (cur === 'IQD' ? p.price * q * rate : p.price * q), time: new Date()}); localStorage.setItem('products', JSON.stringify(products)); localStorage.setItem('history', JSON.stringify(history)); render(); alert("فرۆشرا"); }
</script>
</body>
</html>
